name: Release

# release-please mantiene abierto un Release PR sobre master: sube la versión y
# escribe CHANGELOG.md a partir de los commits. Al mergearlo crea el tag y el
# GitHub Release. Ver "Releases" en el CONTRIBUTING.md del workspace.
on:
  push:
    branches: [master]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # No usa GITHUB_TOKEN por dos motivos: la org no deja que Actions abra
      # PRs, y un PR abierto con ese token no dispara el CI. El secret de org
      # RELEASE_PLEASE_TOKEN es un PAT con contents y pull-requests en escritura.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
